services:
  postgres:
    image: postgres:15-alpine
    container_name: petpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petpro_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-petpro}
    ports:
      # Host 5433 avoids clashing with a native PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petpro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: petpro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: petpro-backend
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-petpro}:${POSTGRES_PASSWORD:-petpro_dev_password}@postgres:5432/${POSTGRES_DB:-petpro}
      REDIS_URL: redis://redis:6379/0
      EVENT_MODE: taskiq
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      # Подтверждение email / отправка писем (значения из корневого .env)
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM:-PetPro <noreply@petpro.app>}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: petpro-worker
    restart: unless-stopped
    command: taskiq worker app.worker:broker
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-petpro}:${POSTGRES_PASSWORD:-petpro_dev_password}@postgres:5432/${POSTGRES_DB:-petpro}
      REDIS_URL: redis://redis:6379/0
      EVENT_MODE: taskiq
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: petpro-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
